<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla JS Kanban Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="board-header">
    <div>
      <h1>My Task Board</h1>
      <p>Vanilla JS Kanban with drag &amp; drop, inline edit, filters, and localStorage.</p>
    </div>

    <div class="filter-bar">
      <input type="search" id="search-input" placeholder="Search cards..." aria-label="Search cards">
      <select id="priority-filter" aria-label="Filter by priority">
        <option value="all">All priorities</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
  </header>

  <main class="container">
    <!-- add new task form -->
    <form id="add-card-form" class="add-form">
      <input type="text" id="new-title" placeholder="What needs to get done?" required maxlength="80" aria-label="Task title">
      <select id="new-priority" aria-label="Task priority">
        <option value="medium">Medium priority</option>
        <option value="low">Low priority</option>
        <option value="high">High priority</option>
      </select>
      <select id="new-column" aria-label="Starting column">
        <option value="todo">To Do</option>
        <option value="inprogress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <button type="submit">Add Task</button>
    </form>

    <!-- 3 kanban columns -->
    <section class="board" aria-label="Kanban columns">
      <div class="column" data-col="todo">
        <div class="col-header">
          <h2>To Do</h2>
          <span class="count" id="count-todo">0</span>
        </div>
        <div class="card-list" id="list-todo"></div>
      </div>

      <div class="column" data-col="inprogress">
        <div class="col-header">
          <h2>In Progress</h2>
          <span class="count" id="count-inprogress">0</span>
        </div>
        <div class="card-list" id="list-inprogress"></div>
      </div>

      <div class="column" data-col="done">
        <div class="col-header">
          <h2>Done</h2>
          <span class="count" id="count-done">0</span>
        </div>
        <div class="card-list" id="list-done"></div>
      </div>
    </section>
  </main>
